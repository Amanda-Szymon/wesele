<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wesele</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Lora&display=swap" rel="stylesheet">

  <style>
    body {
  background-image: url('kwiatuszki.jpg');
  height: 100vh;
  background-size: cover;       /* Fill height and crop sides if needed */
  background-position: center;  /* Keep it centered */
  background-repeat: no-repeat; 
      font-family: 'Lora', serif;
    }

    .main-title {
      font-family: 'Dancing Script', cursive;
      font-size: 2.5rem;
      text-align: center;
      margin: 2rem 0;
      color: #03522d;
    }

    .option-card {
      background-color: rgba(255, 255, 255, 0.4);;
      
      border: 2px solid #03522d;
      border-radius: 1rem;
      padding: 2rem;
      text-align: center;
      transition: transform 0.2s ease-in-out;
      cursor: pointer;
      color: #03522d;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .option-card:hover {
      background-color: #f9f2f2;
      transform: scale(1.03);
    }

    .option-icon {
      font-size: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="main-title">Amanda & Szymon<br>13.08.2025</div>

    <div class="row g-4 justify-content-center">
      <div class="col-10 col-sm-6">
        <a href="menu.html" class="text-decoration-none">
          <div class="option-card">
            <i class="bi bi-fork-knife option-icon"></i>
            <span>Menu</span>
          </div>
        </a>
      </div>
      <div class="col-10 col-sm-6">
        <a href="photos.html" class="text-decoration-none">
          <div class="option-card">
            <i class="bi bi-camera-fill option-icon"></i>
            <span>Zdjęcia</span>
          </div>
        </a>
      </div>
    </div>

  </div>

</body>
</html>
